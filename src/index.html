    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0b;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        padding: 24px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(232, 181, 77, 0.14), transparent 34%),
          #0a0a0b;
        color: #fff8ee;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }

      .boot-splash::before {
        content: '';
        position: absolute;
        inset: -20%;
        background: radial-gradient(circle, rgba(200, 16, 46, 0.16), transparent 55%);
        animation: boot-pulse 2.4s ease-in-out infinite;
      }

      .boot-splash__logo {
        position: relative;
        width: 96px;
        height: auto;
        filter: drop-shadow(0 14px 30px rgba(232, 181, 77, 0.18));
      }

      .boot-splash__name {
        position: relative;
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(26px, 5vw, 34px);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .boot-splash__bar {
        position: relative;
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 248, 238, 0.14);
      }

      .boot-splash__bar span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c8102e, #e8b54d);
        animation: boot-slide 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .boot-splash__hint {
        position: relative;
        margin: 0;
        color: rgba(255, 248, 238, 0.62);
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      @keyframes boot-slide {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(320%);
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash::before,
        .boot-splash__bar span {
          animation: none;
        }
      }
    </style>
